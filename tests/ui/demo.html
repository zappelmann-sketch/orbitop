<!-- Sichtprüfung ohne App: lädt die Oberfläche mit demo-data.js (scripts/dump-snapshot.py --anonymize --js).
     ?threads=16 vervielfacht die CPU-Threads, um die Balkenreihe zu sehen; #procs öffnet den Reiter „Prozesse“.
     Gleiche CSP wie index.html. Braucht einen HTTP-Server, denn Chrome lädt ES-Module nicht über file://: im
     Wurzelordner des Repositorys `python3 -m http.server --bind 127.0.0.1`, dann /tests/ui/demo.html öffnen. -->
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>orbitop demo</title>
<link rel="stylesheet" href="../../orbitop/ui/css/base.css">
<link rel="stylesheet" href="../../orbitop/ui/css/header.css">

<link rel="stylesheet" href="../../orbitop/ui/css/procs.css">
<link rel="stylesheet" href="../../orbitop/ui/css/dialogs.css">

</head>

</html>
